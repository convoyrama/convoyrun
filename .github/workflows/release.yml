name: Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with the build artifacts'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm install

      - name: Build
        run: npm run tauri build

      # bundle.active=false en tauri.conf.json — sin instaladores, solo el
      # binario crudo que compila cargo.
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p final-binaries

          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cp src-tauri/target/release/convoyrun.exe final-binaries/ConvoyRun-windows-x64.exe
          else
            cp src-tauri/target/release/convoyrun final-binaries/ConvoyRun-linux-x64
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ConvoyRun-Desktop-${{ matrix.platform }}
          path: final-binaries/*

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ConvoyRun-Desktop-*
          merge-multiple: true
          path: final-binaries

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: final-binaries/*
