name: Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release with artifacts'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            os-label: linux
            bundle-flag: none
          - platform: windows-latest
            os-label: windows
            bundle-flag: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ConvoyRun v$VERSION for ${{ matrix.os-label }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os-label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm install

      - name: Build
        run: npm run tauri build -- --bundles ${{ matrix.bundle-flag }}

      - name: Collect binary (Linux)
        if: matrix.os-label == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/convoyrun "dist/ConvoyRun-${{ steps.get_version.outputs.version }}-linux-x64"
          chmod +x "dist/ConvoyRun-${{ steps.get_version.outputs.version }}-linux-x64"

      - name: Collect installer (Windows)
        if: matrix.os-label == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe "dist/ConvoyRun-${{ steps.get_version.outputs.version }}-x64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ConvoyRun-${{ steps.get_version.outputs.version }}-${{ matrix.os-label }}
          path: dist/*

  release:
    needs: build
    if: github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: ConvoyRun-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: ConvoyRun v${{ steps.get_version.outputs.version }}
          files: dist/*
          generate_release_notes: true
