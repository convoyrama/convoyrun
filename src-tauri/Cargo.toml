[package]
name = "convoyrun"
version = "0.3.7"
description = "ATS/ETS2 convoy & event manager"
authors = ["CONVOYRAMA"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "convoyrun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

# iroh 1.0 — P2P networking (gossip + blobs)
iroh = "1.0"
iroh-gossip = "0.101"
iroh-blobs = "0.103"

# Crypto para firmas y backup de identidad
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.8"

# Async runtime — solo features necesarios
tokio = { version = "1", features = ["rt", "sync", "fs", "time"] }

# Encriptación para backup de clave
aes-gcm = "0.10"
base64 = "0.22"
argon2 = "0.5"

# Upload de imágenes a Catbox (multipart desde Rust, sin CORS)
reqwest = { version = "0.12", features = ["multipart", "native-tls"] }

# Utilidades
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
bytes = "1"
sha2 = "0.10"
futures-lite = "2"
blake3 = "1"
distributed-topic-tracker = { version = "0.3.5", features = ["iroh-gossip"] }

[profile.release]
strip = true          # Eliminar symbols (~13 MB de ahorro)
lto = true            # Link Time Optimization (~5-10 MB de ahorro)
codegen-units = 1     # Mejor optimización (compilación más lenta)
panic = "abort"       # Sin unwind tables (~5% de ahorro)
opt-level = 3         # Máxima optimización de velocidad

